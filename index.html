    <!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width , initial-scale=1.0">

            <title>tic-tac-toe-game</title>

            <link rel="stylesheet" href="style.css">
            <script src="script.js" defer></script>
        </head>

            <body>

                <section id="sign-up">
                    <form id="form">
                        <legend>Enter Your Names</legend>

                        <label for="player1-name">Player 1:</label>
                        <input id="player1" placeholder="name">

                        <label for="player2">Player 2:</label>
                        <input id="player2" placeholder="name">

                        <button id="submit-btn">Play Now!</button>
                    </form>
                </section>
                <section id="gameboard" class="hidden">
                <h1>tic-tac-toe</h1>
                <div id="match-title">
                    <h1 id="match-name"></h1>
                    <h1 id="match-winner"></h1>
                </div>

                <div id="board-container" >
                    <button class="tile" data-id="0"></button>
                    <button class="tile" data-id="1"></button>
                    <button class="tile" data-id="2"></button>
                    <button class="tile" data-id="3"></button>
                        <button class="tile" data-id="4"></button>
                        <button class="tile" data-id="5"></button>
                        <button class="tile" data-id="6"></button>
                        <button class="tile" data-id="7"></button>
                            <button class="tile" data-id="8"></button>
                </div>

                <button id="restartBtn">Restart Game</button>
                </section>
            </body>
    </html>
